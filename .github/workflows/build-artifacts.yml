name: Build Artifacts

on:
  push:
    branches: [main]

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Scoped to :host for now — extend as :terminal and :pos land.
      - run: ./gradlew host:distZip
      - uses: actions/upload-artifact@v4
        with:
          name: host-dist-${{ github.sha }}
          path: host/build/distributions/*.zip
          retention-days: 90
