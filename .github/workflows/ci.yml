name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  # Steps below skip cleanly (no failure) until SNYK_TOKEN is added as a repo secret.
  # `secrets` can't be referenced directly in an `if:` (job or step) — only in `env:` —
  # so it's lifted into a job-level env var and steps condition on that instead.
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: ${{ env.SNYK_TOKEN != '' }}
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ env.SNYK_TOKEN != '' }}
      - uses: snyk/actions/setup@master
        if: ${{ env.SNYK_TOKEN != '' }}
      - run: snyk test --all-projects --severity-threshold=high
        if: ${{ env.SNYK_TOKEN != '' }}
